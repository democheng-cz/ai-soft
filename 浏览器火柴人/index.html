<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>休息一下</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-veil" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">REST / FOCUS CONSOLE</p>
          <h1>休息一下</h1>
        </div>
        <div class="status-strip" aria-live="polite">
          <span id="modePill" class="pill focus">专注中</span>
          <span id="todayTotal">今日 0 分钟</span>
          <span id="streakText">连续 0 天</span>
        </div>
      </header>

      <section class="workspace">
        <section class="timer-panel" aria-label="专注与休息计时器">
          <div class="timer-head">
            <div>
              <p class="section-kicker">当前轮次</p>
              <h2 id="sessionTitle">深度专注</h2>
            </div>
            <button id="switchModeBtn" class="ghost-btn" type="button">切换</button>
          </div>

          <div class="timer-ring" id="timerRing">
            <svg viewBox="0 0 240 240" aria-hidden="true">
              <circle class="ring-track" cx="120" cy="120" r="104"></circle>
              <circle id="ringProgress" class="ring-progress" cx="120" cy="120" r="104"></circle>
            </svg>
            <div class="timer-copy">
              <span id="timeLeft">25:00</span>
              <small id="timerHint">Space 开始 / 暂停</small>
            </div>
          </div>

          <div class="time-controls">
            <label>
              专注
              <input id="focusMinutes" type="number" min="1" max="180" value="25" />
              <span>分</span>
            </label>
            <label>
              休息
              <input id="breakMinutes" type="number" min="1" max="60" value="5" />
              <span>分</span>
            </label>
          </div>

          <div class="primary-actions">
            <button id="startPauseBtn" class="primary-btn" type="button">开始专注</button>
            <button id="completeBtn" class="secondary-btn" type="button">完成一段</button>
            <button id="resetBtn" class="icon-btn" type="button" title="重置计时">↻</button>
          </div>
        </section>

        <section class="side-stack">
          <article class="panel compact-panel">
            <div class="panel-title">
              <div>
                <p class="section-kicker">白噪音</p>
                <h2>声音场</h2>
              </div>
              <button id="noiseToggle" class="icon-btn" type="button" title="播放白噪音">▶</button>
            </div>
            <div class="noise-options" role="group" aria-label="白噪音类型">
              <button class="noise-chip active" data-noise="rain" type="button">雨声</button>
              <button class="noise-chip" data-noise="cafe" type="button">咖啡馆</button>
              <button class="noise-chip" data-noise="wind" type="button">风声</button>
            </div>
            <label class="range-row">
              音量
              <input id="volumeRange" type="range" min="0" max="100" value="35" />
            </label>
          </article>

          <article class="panel compact-panel">
            <div class="panel-title">
              <div>
                <p class="section-kicker">背景</p>
                <h2>专注桌面</h2>
              </div>
              <button id="clearBgBtn" class="ghost-btn" type="button">恢复</button>
            </div>
            <div class="background-tools">
              <label class="file-picker">
                上传图片
                <input id="bgUpload" type="file" accept="image/*" />
              </label>
              <input id="accentColor" type="color" value="#2f8f83" aria-label="强调色" />
            </div>
          </article>

          <article class="panel compact-panel">
            <div class="panel-title">
              <div>
                <p class="section-kicker">效率记录</p>
                <h2>本次评分</h2>
              </div>
              <span id="efficiencyValue" class="metric-badge">82%</span>
            </div>
            <input id="efficiencyRange" type="range" min="20" max="100" value="82" />
            <p class="quiet-line">完成专注段时会记录当前效率。</p>
          </article>
        </section>
      </section>

      <section class="lower-grid">
        <article class="panel todo-panel">
          <div class="panel-title">
            <div>
              <p class="section-kicker">任务</p>
              <h2>待办清单</h2>
            </div>
            <span id="todoCounter" class="metric-badge">0/0</span>
          </div>
          <form id="todoForm" class="todo-form">
            <input id="todoInput" type="text" maxlength="48" placeholder="输入今天要推进的任务" />
            <button type="submit" class="secondary-btn">添加</button>
          </form>
          <ul id="todoList" class="todo-list"></ul>
        </article>

        <article class="panel timeline-panel">
          <div class="panel-title">
            <div>
              <p class="section-kicker">时间线</p>
              <h2>专注 / 休息记录</h2>
            </div>
            <button id="clearHistoryBtn" class="ghost-btn" type="button">清空</button>
          </div>
          <div id="timeline" class="timeline"></div>
        </article>

        <article class="panel stats-panel">
          <div class="panel-title">
            <div>
              <p class="section-kicker">统计</p>
              <h2>专注表现</h2>
            </div>
            <span id="avgEfficiency" class="metric-badge">0%</span>
          </div>
          <div class="stats-grid">
            <div>
              <strong id="focusCount">0</strong>
              <span>专注段</span>
            </div>
            <div>
              <strong id="focusTotal">0h</strong>
              <span>总时长</span>
            </div>
            <div>
              <strong id="bestPeriod">--</strong>
              <span>高效时段</span>
            </div>
          </div>
          <div class="period-bars" id="periodBars" aria-label="专注时间段展示"></div>
        </article>

        <article class="panel heatmap-panel">
          <div class="panel-title">
            <div>
              <p class="section-kicker">热力图</p>
              <h2>最近 35 天</h2>
            </div>
            <span class="quiet-line">分钟</span>
          </div>
          <div id="heatmap" class="heatmap" aria-label="专注时长热力图"></div>
        </article>
      </section>

      <footer class="shortcuts">
        <span><kbd>Space</kbd> 开始/暂停</span>
        <span><kbd>N</kbd> 白噪音</span>
        <span><kbd>T</kbd> 新任务</span>
        <span><kbd>R</kbd> 重置</span>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
